# xdg-desktop-portal-hyprland (screen sharing). Applied on portal restart:
#   systemctl --user restart xdg-desktop-portal-hyprland
screencopy {
    # Cursor mode used when the app doesn't ask for one (1 = hidden, 2 = embedded).
    # Vesktop/Discord don't ask, so without this the cursor is missing from the share.
    cursor_mode = 2
    # Tick "Allow a restore token" in the share picker by default. Chromium/Electron apps
    # (Vesktop) open a second portal session for the real capture and reuse the pick
    # through that token; without it the picker pops up again.
    allow_token_by_default = true
}
