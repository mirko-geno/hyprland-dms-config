[general]
# Colors generated by DMS (updated when the theme/wallpaper changes)
import = ["~/.config/alacritty/dank-theme.toml"]

[window]
# Same transparency as the DMS bar and popups (transparency 0.5)
opacity = 0.5

[cursor]
# Vertical line text cursor instead of a block
style = { shape = "Beam", blinking = "On" }
# By default it stops blinking after 5 s of inactivity; 0 = always blink
blink_timeout = 0

[selection]
# Selecting text copies it to the clipboard, so Ctrl+C is free to cancel commands
save_to_clipboard = true

[keyboard]
# Paste with Ctrl+V and search with Ctrl+F (no Shift needed)
bindings = [
    { key = "V", mods = "Control", action = "Paste" },
    { key = "F", mods = "Control", mode = "~Search", action = "SearchForward" },
]
